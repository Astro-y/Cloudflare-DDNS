name: Go checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l *.go)"
      - name: Check Linux bootstrap script
        run: |
          bash -n install.sh
          shellcheck install.sh
      - run: go test -race -mod=readonly -coverprofile=coverage.out ./...
      - run: go vet -mod=readonly ./...
      - name: Build static Linux binaries
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests
      - name: Smoke test public installer (exit panel)
        run: |
          log="$(mktemp)"
          trap 'rm -f -- "$log"' EXIT
          printf '0\n' | timeout 180 script --quiet --return --command 'bash -c "$(curl -fsSL https://raw.githubusercontent.com/Astro-y/Cloudflare-DDNS/main/install.sh)"' /dev/null | tee "$log"
          expected="$(./dist/cfddns-linux-amd64 --internal-version)"
          grep -F "版本：$expected" "$log"
      - uses: actions/upload-artifact@v4
        with:
          name: cfddns-linux
          path: dist/
